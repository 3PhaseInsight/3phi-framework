[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3phi-framework"
dynamic = ["version"]
description = "Framework for 3phi project"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Christian Fotteler", email = "chris@inilab.dk" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"
version_scheme = "guess-next-dev"     # non-tag builds become X.Y.Z.devN
local_scheme = "node-and-date"        # adds +<meta> on non-tag builds

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["dist", "**/__pycache__"]

[tool.ruff.lint]
select = [
    # pycodestyle (style issues)
    "E",
    # Pyflakes (unused imports/vars, etc.)
    "F",
    # pycodestyle warnings (stricter style)
    "W",
    # pyupgrade (modernize to newer Python)
    "UP",
    # flake8-bugbear (common bug patterns)
    "B",
    # flake8-simplify
    "SIM",
    # isort (import sorting)
    "I",
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
